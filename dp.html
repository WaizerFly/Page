<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Транзакции</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;500;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0 }

    body {
      font-family: 'Lato', sans-serif;
      background: #f4f2ee;
      color: #1a1a1a;
      padding: 36px 28px;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(ellipse at 10% 20%, rgba(100, 160, 255, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(160, 100, 255, 0.05) 0%, transparent 50%);
      z-index: -1;
    }

    .page-header {
      max-width: 680px;
      margin: 0 auto 28px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1.5px solid #e0dcd5;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: 0.3px;
    }

    #status {
      color: #aaa;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    #list {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: #ffffff;
      border: 1px solid #e0dcd5;
      border-radius: 13px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.04);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      animation: fadeIn 0.35s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item:hover {
      box-shadow: 0 2px 8px rgba(0,0,0,0.07), 0 8px 24px rgba(0,0,0,0.07);
      transform: translateY(-1px);
    }

    .left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .name {
      font-weight: 700;
      font-size: 0.97rem;
      color: #1a1a1a;
    }

    .msg {
      color: #888;
      font-size: 0.83rem;
      line-height: 1.4;
    }

    .date {
      color: #bbb;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .amount {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2e9e5c;
      white-space: nowrap;
      background: rgba(46,158,92,0.08);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(46,158,92,0.15);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #ccc;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .empty-state .icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 12px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>Транзакции</h1>
    <p id="status">Загрузка...</p>
  </div>
  <div id="list"></div>

  <script>
    const WORKER_URL = "https://cry.waizerfly.com/api/getdonates"

    async function load() {
      try {
        const res = await fetch(WORKER_URL)
        const data = await res.json()
        const list = document.getElementById("list")
        const status = document.getElementById("status")

        if (!data.length) {
          status.textContent = "0 транзакций"
          list.innerHTML = `
            <div class="empty-state">
              <span class="icon">📭</span>
              Транзакций пока нет
            </div>`
          return
        }

        status.textContent = `Показано: ${data.length}`
        list.innerHTML = data.map((d, i) => `
          <div class="item" style="animation-delay:${i * 40}ms">
            <div class="left">
              <span class="name">${d.what || "Аноним"}</span>
              ${d.comment ? `<span class="msg">${d.comment}</span>` : ""}
              <span class="date">${new Date(d.created_at).toLocaleString("ru-RU")}</span>
            </div>
            <span class="amount">${d.sum} ₽</span>
          </div>
        `).join("")
      } catch(e) {
        document.getElementById("status").textContent = "Ошибка"
        document.getElementById("list").innerHTML = `
          <div class="empty-state">
            <span class="icon">⚠️</span>
            Ошибка загрузки: ${e.message}
          </div>`
      }
    }

    load()
    setInterval(load, 60000)
  </script>
</body>
</html>
