<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kollages - Плак-плак v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   ROOT & RESET
═══════════════════════════════════════════════════════ */
:root {
  --bg:        #07070f;
  --surface:   #0d0d1a;
  --surface2:  #12121f;
  --surface3:  #18182a;
  --border:    #22223a;
  --border2:   #1a1a2c;
  --text:      #ddddf0;
  --text-dim:  #6060a0;
  --text-muted:#35355a;
  --font:      'Azeret Mono', 'Courier New', monospace;
  --radius:    4px;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { font-size: 13px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
input  { font-family: inherit; }

/* ═══════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════ */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--border2);
}
.header-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .35em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.header-title span { color: var(--text); }

.load-bar-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
}
.load-label {
  font-size: 9px;
  letter-spacing: .2em;
  color: var(--text-muted);
  text-transform: uppercase;
  min-width: 110px;
  text-align: right;
}
.load-label.ready  { color: #22c55e; }
.load-label.error  { color: #ef4444; }
.load-track {
  width: 80px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}
.load-fill {
  height: 100%;
  width: 0%;
  background: var(--text-dim);
  border-radius: 1px;
  transition: width .3s ease;
}
.load-fill.ready { background: #22c55e; }

/* ═══════════════════════════════════════════════════════
   TRANSPORT
═══════════════════════════════════════════════════════ */
.transport {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border2);
  background: var(--surface);
}

/* play / pause */
.play-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: border-color .15s, background .15s;
}
.play-btn:disabled { opacity: .3; cursor: default; }
.play-btn:not(:disabled):hover {
  border-color: var(--text-dim);
  background: var(--surface2);
}
.play-btn svg { width: 13px; height: 13px; pointer-events: none; }

/* time */
.time-cur, .time-dur {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .08em;
  width: 42px;
  flex-shrink: 0;
  color: var(--text);
}
.time-dur { color: var(--text-dim); font-weight: 300; }

/* seek */
.seek-wrap {
  flex: 1;
  height: 24px;
  display: flex;
  align-items: center;
  cursor: pointer;
  user-select: none;
  position: relative;
}
.seek-track {
  width: 100%;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  position: relative;
}
.seek-fill {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0%;
  background: var(--text-dim);
  border-radius: 1px;
  pointer-events: none;
}
.seek-knob {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--text);
  transform: translate(-50%, -50%);
  pointer-events: none;
  transition: transform .1s;
}
.seek-wrap:hover .seek-knob,
.seek-wrap.dragging .seek-knob { transform: translate(-50%, -50%) scale(1.4); }

/* volume */
.vol-group {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}
.vol-lbl {
  font-size: 8px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--text-muted);
}
input[type=range].vol-slider {
  -webkit-appearance: none;
  width: 72px;
  height: 2px;
  background: var(--border);
  outline: none;
  border-radius: 1px;
  cursor: pointer;
}
input[type=range].vol-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--text-dim);
  cursor: pointer;
  transition: background .15s;
}
input[type=range].vol-slider:hover::-webkit-slider-thumb { background: var(--text); }

/* ═══════════════════════════════════════════════════════
   STEMS CONTAINER
═══════════════════════════════════════════════════════ */
.stems { }

/* ── group ── */
.group { border-bottom: 1px solid var(--border2); }

.group-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 28px;
  background: var(--surface);
  user-select: none;
  cursor: pointer;
  transition: background .15s;
  position: relative;
}
.group-hd::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--g-color, transparent);
  opacity: .7;
}
.group-hd:hover { background: var(--surface2); }

.chevron {
  font-size: 7px;
  color: var(--text-muted);
  transition: transform .2s;
  flex-shrink: 0;
  width: 10px;
}
.collapsed > .group-hd > .chevron,
.collapsed > .subgroup-hd > .chevron { transform: rotate(-90deg); }
/* handle subgroup collapsed */
.subgroup.collapsed > .subgroup-hd > .chevron { transform: rotate(-90deg); }

.group-accent {
  width: 3px;
  height: 14px;
  border-radius: 2px;
  flex-shrink: 0;
}
.group-name {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .32em;
  text-transform: uppercase;
  flex: 1;
}
.group-count {
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: .1em;
  margin-right: 8px;
}

/* group toggle pill */
.g-toggle {
  width: 34px;
  height: 18px;
  border-radius: 9px;
  border: 1.5px solid var(--border);
  background: transparent;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color .2s, background .2s;
}
.g-toggle::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: transform .2s, background .2s;
}
/* state: on */
.g-toggle[data-state=on] {
  border-color: var(--g-color);
  background: var(--g-color);
}
.g-toggle[data-state=on]::after {
  transform: translateX(14px);
  background: rgba(0,0,0,.8);
}
/* state: partial */
.g-toggle[data-state=partial] {
  border-color: var(--g-color);
}
.g-toggle[data-state=partial]::after {
  transform: translateX(7px);
  background: var(--g-color);
}
/* state: off */
.g-toggle[data-state=off]::after { background: var(--text-muted); }

/* group children collapse */
.group-body    { }
.group.collapsed .group-body { display: none; }

/* ── subgroup ── */
.subgroup { border-top: 1px solid var(--border2); }

.subgroup-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 28px 7px 44px;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.subgroup-hd:hover { background: var(--surface2); }

.subgroup-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  flex-shrink: 0;
}
.subgroup-name {
  font-size: 8.5px;
  font-weight: 500;
  letter-spacing: .28em;
  text-transform: uppercase;
  color: var(--text-dim);
  flex: 1;
}
.subgroup-count {
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: .1em;
  margin-right: 8px;
}

.sg-toggle {
  width: 28px;
  height: 14px;
  border-radius: 7px;
  border: 1.5px solid var(--border);
  background: transparent;
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color .2s, background .2s;
}
.sg-toggle::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: transform .2s, background .2s;
}
.sg-toggle[data-state=on] {
  border-color: var(--sg-color);
  background: var(--sg-color);
}
.sg-toggle[data-state=on]::after {
  transform: translateX(12px);
  background: rgba(0,0,0,.8);
}
.sg-toggle[data-state=partial] {
  border-color: var(--sg-color);
}
.sg-toggle[data-state=partial]::after {
  transform: translateX(6px);
  background: var(--sg-color);
}

.subgroup-body { }
.subgroup.collapsed .subgroup-body { display: none; }

/* ── stem row ── */
.stem-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 28px 5px 60px;
  border-top: 1px solid var(--border2);
  transition: background .15s;
  position: relative;
}
/* stems directly under group (no subgroup) */
.group-body > .stem-row { padding-left: 44px; }

.stem-row:hover { background: rgba(255,255,255,.015); }

.stem-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex-shrink: 0;
  transition: opacity .25s;
}
.stem-row.muted .stem-dot { opacity: .2; }

.stem-lbl {
  font-size: 8.5px;
  font-weight: 400;
  letter-spacing: .2em;
  text-transform: uppercase;
  width: 86px;
  flex-shrink: 0;
  color: var(--text);
  transition: color .25s;
}
.stem-row.muted .stem-lbl { color: var(--text-muted); }

/* spectrogram strip */
.spec-strip {
  flex: 1;
  height: 54px;
  border-radius: 3px;
  overflow: hidden;
  position: relative;
  background: var(--surface3);
  transition: opacity .3s;
  cursor: pointer;
}
.spec-strip img {
  width: 100%;
  height: 100%;
  object-fit: fill;
  display: block;
  user-select: none;
  pointer-events: none;
}
.spec-strip.no-img {
  background: repeating-linear-gradient(
    90deg,
    var(--surface3) 0px,
    var(--surface3) 3px,
    transparent 3px,
    transparent 6px
  );
}
.stem-row.muted .spec-strip { opacity: .18; }

/* playhead */
.playhead {
  position: absolute;
  top: 0; bottom: 0;
  left: 0%;
  width: 1.5px;
  background: rgba(255,255,255,.75);
  box-shadow: 0 0 5px rgba(255,255,255,.4);
  pointer-events: none;
  will-change: left;
}

/* per-stem volume */
input[type=range].stem-vol {
  -webkit-appearance: none;
  width: 44px;
  height: 2px;
  background: var(--border);
  outline: none;
  border-radius: 1px;
  cursor: pointer;
  flex-shrink: 0;
  transition: opacity .25s;
}
.stem-row.muted input[type=range].stem-vol { opacity: .25; cursor: default; }
input[type=range].stem-vol::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--thumb-color, var(--text-dim));
  cursor: pointer;
  transition: filter .15s;
}
input[type=range].stem-vol:hover::-webkit-slider-thumb {
  filter: brightness(1.4);
}

/* stem toggle button */
.stem-toggle {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: border-color .15s, background .15s;
}
.stem-toggle[data-on=true] {
  border-color: var(--s-color);
  background: var(--s-color);
}
.stem-toggle svg {
  width: 8px;
  height: 8px;
  pointer-events: none;
  color: rgba(0,0,0,.8);
  opacity: 0;
  transition: opacity .15s;
}
.stem-toggle[data-on=true] svg { opacity: 1; }

/* ═══════════════════════════════════════════════════════
   MISC
═══════════════════════════════════════════════════════ */
.no-select { user-select: none; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">◈ <span>Kollages - Плак-плак v2</span></div>
  <div class="load-bar-wrap">
    <div class="load-label" id="loadLabel">Loading… 0 / 10</div>
    <div class="load-track"><div class="load-fill" id="loadFill"></div></div>
  </div>
</div>

<!-- TRANSPORT -->
<div class="transport">
  <button class="play-btn" id="playBtn" disabled title="Play / Pause">
    <svg id="icPlay"  viewBox="0 0 20 20" fill="currentColor"><polygon points="4,2 18,10 4,18"/></svg>
    <svg id="icPause" viewBox="0 0 20 20" fill="currentColor" style="display:none"><rect x="3" y="2" width="5" height="16" rx="1"/><rect x="12" y="2" width="5" height="16" rx="1"/></svg>
  </button>
  <div class="time-cur" id="timeCur">0:00</div>
  <div class="seek-wrap" id="seekWrap">
    <div class="seek-track">
      <div class="seek-fill"  id="seekFill"></div>
      <div class="seek-knob" id="seekKnob"></div>
    </div>
  </div>
  <div class="time-dur" id="timeDur">0:00</div>
  <div class="vol-group">
    <span class="vol-lbl">Vol</span>
    <input type="range" class="vol-slider" id="masterVol" min="0" max="1" step="0.01" value="1">
  </div>
</div>

<!-- STEM GROUPS (generated by JS) -->
<div class="stems" id="stemsRoot"></div>

<!-- ═══════════════════════════════════════════════════
     DATA & LOGIC
═══════════════════════════════════════════════════ -->
<script>
// ─────────────────────────────────────────────────────
//  STEM TREE DEFINITION
// ─────────────────────────────────────────────────────
const TREE = [
  {
    id: 'vocal', label: 'Vocal', color: '#FF4D8D', type: 'group',
    children: [
      { id: 'lead', label: 'Lead',  file: 'lead.m4a', spec: 'spec_lead.webp', color: '#FF4D8D' },
      { id: 'back', label: 'Back',  file: 'back.m4a', spec: 'spec_back.webp', color: '#FF9ABF' },
    ]
  },
  {
    id: 'instrumental', label: 'Instrumental', color: '#7C3AED', type: 'group',
    children: [
      {
        id: 'bass', label: 'Bass', color: '#7C3AED', type: 'subgroup',
        children: [
          { id: 'bass_stem', label: 'Bass', file: 'bass.m4a', spec: 'spec_bass.webp', color: '#7C3AED' },
        ]
      },
      {
        id: 'drums', label: 'Drums', color: '#F97316', type: 'subgroup',
        children: [
          { id: 'crash',  label: 'Crash',   file: 'crash.m4a',   spec: 'spec_crash.webp',   color: '#EF4444' },
          { id: 'cymbals',label: 'Cymbals', file: 'cymbals.m4a', spec: 'spec_cymbals.webp', color: '#F59E0B' },
          { id: 'kick',   label: 'Kick',    file: 'kick.m4a',    spec: 'spec_kick.webp',    color: '#F97316' },
          { id: 'snare',  label: 'Snare',   file: 'snare.m4a',   spec: 'spec_snare.webp',   color: '#FB923C' },
          { id: 'toms',   label: 'Toms',    file: 'toms.m4a',    spec: 'spec_toms.webp',    color: '#D97706' },
        ]
      },
      {
        id: 'others', label: 'Others', color: '#10B981', type: 'subgroup',
        children: [
          { id: 'strings',     label: 'Strings',     file: 'strings.m4a',     spec: 'spec_strings.webp',     color: '#10B981' },
          { id: 'harpsichord', label: 'Harpsichord', file: 'harpsichord.m4a', spec: 'spec_harpsichord.webp', color: '#06B6D4' },
        ]
      },
    ]
  }
];

// Flat list of all stems
const ALL_STEMS = [];
function collectStems(nodes) {
  for (const n of nodes) {
    if (n.file) { ALL_STEMS.push(n); }
    else if (n.children) collectStems(n.children);
  }
}
collectStems(TREE);

// ─────────────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────────────
const stemOn   = {};  // stemId → bool
const stemVol  = {};  // stemId → 0..1
ALL_STEMS.forEach(s => { stemOn[s.id] = true; stemVol[s.id] = 1; });

// Audio (plain HTMLAudioElement, no Web Audio API – works on file://)
const audioEls  = {};      // stemId → HTMLAudioElement
let   masterVol = 1;
let   isPlaying = false;
let   totalDur  = 0;
let   rafId     = null;

function currentTime() {
  const el = Object.values(audioEls)[0];
  return el ? el.currentTime : 0;
}

function applyVolume(stemId) {
  const el = audioEls[stemId];
  if (el) el.volume = stemOn[stemId] ? Math.min(1, stemVol[stemId] * masterVol) : 0;
}

// ─────────────────────────────────────────────────────
//  DOM BUILDER
// ─────────────────────────────────────────────────────
const root = document.getElementById('stemsRoot');

function stemChildren(stems, parentClass) {
  return stems.map(stem => {
    const row = document.createElement('div');
    row.className = `stem-row ${parentClass || ''}`;
    row.id = `sr-${stem.id}`;
    row.innerHTML = `
      <div class="stem-dot" style="background:${stem.color}"></div>
      <div class="stem-lbl">${stem.label}</div>
      <div class="spec-strip" id="ss-${stem.id}">
        <img src="${stem.spec}" alt="" onerror="this.parentElement.classList.add('no-img');this.remove()">
        <div class="playhead" id="ph-${stem.id}"></div>
      </div>
      <input type="range" class="stem-vol" min="0" max="1" step="0.01" value="1"
             style="--webkit-slider-runnable-track-color:${stem.color}"
             id="sv-${stem.id}">
      <button class="stem-toggle" data-on="true" data-stem="${stem.id}"
              style="--s-color:${stem.color}" id="st-${stem.id}" title="Toggle ${stem.label}">
        <svg viewBox="0 0 12 12" fill="currentColor"><polyline points="1,6 5,10 11,2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    `;

    // vol slider
    const volSlider = row.querySelector(`#sv-${stem.id}`);
    volSlider.style.setProperty('--thumb-color', stem.color);
    volSlider.addEventListener('input', e => {
      stemVol[stem.id] = parseFloat(e.target.value);
      applyVolume(stem.id);
    });

    // toggle button
    row.querySelector(`#st-${stem.id}`).addEventListener('click', e => {
      e.stopPropagation();
      toggleStem(stem.id);
    });

    // click spectrogram → seek
    row.querySelector(`#ss-${stem.id}`).addEventListener('click', e => {
      if (!totalDur) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      seekTo(ratio * totalDur);
    });

    return row;
  });
}

function buildSubgroup(sg) {
  const wrap = document.createElement('div');
  wrap.className = 'subgroup';
  wrap.id = `sg-${sg.id}`;

  const hd = document.createElement('div');
  hd.className = 'subgroup-hd';
  hd.innerHTML = `
    <span class="chevron">▼</span>
    <span class="subgroup-dot" style="background:${sg.color}"></span>
    <span class="subgroup-name" style="color:${sg.color}">${sg.label}</span>
    <span class="subgroup-count">${sg.children.length} stem${sg.children.length>1?'s':''}</span>
    <button class="sg-toggle" data-state="on" data-sg="${sg.id}"
            style="--sg-color:${sg.color}" title="Toggle ${sg.label}"></button>
  `;
  hd.querySelector('.sg-toggle').addEventListener('click', e => {
    e.stopPropagation();
    toggleSubgroup(sg.id);
  });
  hd.addEventListener('click', () => toggleCollapseSubgroup(sg.id));

  const body = document.createElement('div');
  body.className = 'subgroup-body';
  body.id = `sgb-${sg.id}`;
  stemChildren(sg.children).forEach(el => body.appendChild(el));

  wrap.appendChild(hd);
  wrap.appendChild(body);
  return wrap;
}

function buildGroup(g) {
  const wrap = document.createElement('div');
  wrap.className = 'group';
  wrap.id = `g-${g.id}`;
  wrap.style.setProperty('--g-color', g.color);

  const stems = g.children.filter(c => c.file);
  const subs  = g.children.filter(c => !c.file);
  const totalCount = stems.length + subs.reduce((a, s) => a + s.children.length, 0);

  const hd = document.createElement('div');
  hd.className = 'group-hd';
  hd.style.setProperty('--g-color', g.color);
  hd.innerHTML = `
    <span class="chevron">▼</span>
    <span class="group-name" style="color:${g.color}">${g.label}</span>
    <span class="group-count">${totalCount} stem${totalCount>1?'s':''}</span>
    <button class="g-toggle" data-state="on" data-group="${g.id}"
            style="--g-color:${g.color}" title="Toggle ${g.label}"></button>
  `;
  hd.querySelector('.g-toggle').addEventListener('click', e => {
    e.stopPropagation();
    toggleGroup(g.id);
  });
  hd.addEventListener('click', () => toggleCollapseGroup(g.id));

  const body = document.createElement('div');
  body.className = 'group-body';
  body.id = `gb-${g.id}`;

  // direct stem children
  stemChildren(stems, '').forEach(el => body.appendChild(el));
  // subgroups
  subs.forEach(sg => body.appendChild(buildSubgroup(sg)));

  wrap.appendChild(hd);
  wrap.appendChild(body);
  return wrap;
}

TREE.forEach(g => root.appendChild(buildGroup(g)));

// ─────────────────────────────────────────────────────
//  COLLAPSE / EXPAND
// ─────────────────────────────────────────────────────
function toggleCollapseGroup(id) {
  document.getElementById(`g-${id}`).classList.toggle('collapsed');
}
function toggleCollapseSubgroup(id) {
  document.getElementById(`sg-${id}`).classList.toggle('collapsed');
}

// ─────────────────────────────────────────────────────
//  TOGGLE LOGIC
// ─────────────────────────────────────────────────────
function stemsFor(nodeId) {
  // returns stem ids belonging to a group or subgroup
  function collect(nodes) {
    const ids = [];
    for (const n of nodes) {
      if (n.file) ids.push(n.id);
      else if (n.children) ids.push(...collect(n.children));
    }
    return ids;
  }
  function findNode(nodes, id) {
    for (const n of nodes) {
      if (n.id === id) return n;
      if (n.children) { const f = findNode(n.children, id); if (f) return f; }
    }
    return null;
  }
  const node = findNode(TREE, nodeId);
  return node ? collect(node.children || []) : [];
}

function getState(stemIds) {
  const on = stemIds.filter(id => stemOn[id]).length;
  if (on === stemIds.length) return 'on';
  if (on === 0) return 'off';
  return 'partial';
}

function setStemUI(stemId, on) {
  stemOn[stemId] = on;
  applyVolume(stemId);
  const row    = document.getElementById(`sr-${stemId}`);
  const btn    = document.getElementById(`st-${stemId}`);
  if (row) row.classList.toggle('muted', !on);
  if (btn) btn.setAttribute('data-on', on ? 'true' : 'false');
}

function refreshGroupUI(groupId) {
  const ids   = stemsFor(groupId);
  const state = getState(ids);
  const btn   = document.querySelector(`.g-toggle[data-group="${groupId}"]`);
  if (btn) btn.setAttribute('data-state', state);
}

function refreshSubgroupUI(sgId) {
  const ids   = stemsFor(sgId);
  const state = getState(ids);
  const btn   = document.querySelector(`.sg-toggle[data-sg="${sgId}"]`);
  if (btn) btn.setAttribute('data-state', state);
}

function refreshAllUI() {
  // refresh all group/subgroup toggles
  TREE.forEach(g => {
    refreshGroupUI(g.id);
    (g.children || []).filter(c => !c.file).forEach(sg => refreshSubgroupUI(sg.id));
  });
}

function toggleStem(stemId) {
  setStemUI(stemId, !stemOn[stemId]);
  refreshAllUI();
}

function toggleGroup(groupId) {
  const ids   = stemsFor(groupId);
  const state = getState(ids);
  const newOn = state !== 'on';          // if all on → off, else → all on
  ids.forEach(id => setStemUI(id, newOn));
  refreshAllUI();
}

function toggleSubgroup(sgId) {
  const ids   = stemsFor(sgId);
  const state = getState(ids);
  const newOn = state !== 'on';
  ids.forEach(id => setStemUI(id, newOn));
  refreshAllUI();
}

// ─────────────────────────────────────────────────────
//  AUDIO LOADING  (plain HTMLAudioElement – no Web Audio API)
// ─────────────────────────────────────────────────────
let loadedCount = 0;
const TOTAL     = ALL_STEMS.length;

function updateLoadUI() {
  const pct = loadedCount / TOTAL;
  document.getElementById('loadFill').style.width = (pct * 100) + '%';
  if (loadedCount < TOTAL) {
    document.getElementById('loadLabel').textContent = `Loading… ${loadedCount} / ${TOTAL}`;
  } else {
    document.getElementById('loadLabel').textContent = 'Ready';
    document.getElementById('loadLabel').className   = 'load-label ready';
    document.getElementById('loadFill').className    = 'load-fill ready';
    document.getElementById('playBtn').disabled      = false;
  }
}

function loadAll() {
  ALL_STEMS.forEach(stem => {
    const audio = new Audio();
    audio.preload = 'auto';
    audio.src     = stem.file;
    audioEls[stem.id] = audio;

    const onReady = () => {
      if (!isNaN(audio.duration) && audio.duration > totalDur) {
        totalDur = audio.duration;
        document.getElementById('timeDur').textContent = fmt(totalDur);
      }
      loadedCount++;
      updateLoadUI();
    };
    audio.addEventListener('canplaythrough', onReady, { once: true });
    audio.addEventListener('error', () => {
      console.warn('Could not load', stem.file);
      loadedCount++;
      updateLoadUI();
    }, { once: true });
    audio.load();
  });
}

// ─────────────────────────────────────────────────────
//  PLAYBACK  (no Web Audio API needed)
// ─────────────────────────────────────────────────────
function startSources(offset) {
  ALL_STEMS.forEach(stem => {
    const el = audioEls[stem.id];
    if (!el) return;
    el.currentTime = offset;
    applyVolume(stem.id);
    el.play().catch(() => {});
  });
  isPlaying = true;
  startRAF();
  const firstEl = Object.values(audioEls)[0];
  if (firstEl) firstEl.onended = () => { if (!firstEl.loop) stopAll(); };
}

function stopSources() {
  ALL_STEMS.forEach(stem => { if (audioEls[stem.id]) audioEls[stem.id].pause(); });
  isPlaying = false;
  cancelAnimationFrame(rafId);
}

function stopAll() {
  stopSources();
  ALL_STEMS.forEach(stem => { if (audioEls[stem.id]) audioEls[stem.id].currentTime = 0; });
  updateTransportUI(0);
  updatePlayBtn(false);
}

function togglePlay() {
  if (isPlaying) {
    stopSources();
    updatePlayBtn(false);
  } else {
    const t = currentTime();
    startSources(t >= totalDur ? 0 : t);
    updatePlayBtn(true);
  }
}

function seekTo(t) {
  t = Math.max(0, Math.min(t, totalDur));
  ALL_STEMS.forEach(stem => { if (audioEls[stem.id]) audioEls[stem.id].currentTime = t; });
  updateTransportUI(t);
}

// ─────────────────────────────────────────────────────
//  TRANSPORT UI
// ─────────────────────────────────────────────────────
function fmt(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function updatePlayBtn(playing) {
  document.getElementById('icPlay').style.display  = playing ? 'none'  : '';
  document.getElementById('icPause').style.display = playing ? ''      : 'none';
}

function updateTransportUI(t) {
  const pct = totalDur ? (t / totalDur * 100) : 0;
  document.getElementById('timeCur').textContent   = fmt(t);
  document.getElementById('seekFill').style.width  = pct + '%';
  document.getElementById('seekKnob').style.left   = pct + '%';
  // playheads
  ALL_STEMS.forEach(stem => {
    const ph = document.getElementById(`ph-${stem.id}`);
    if (ph) ph.style.left = pct + '%';
  });
}

function startRAF() {
  function tick() {
    if (!isPlaying) return;
    const t = currentTime();
    updateTransportUI(Math.min(t, totalDur));
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

// ─────────────────────────────────────────────────────
//  SEEK BAR INTERACTION
// ─────────────────────────────────────────────────────
(function() {
  const sw = document.getElementById('seekWrap');
  let dragging = false;

  function posFromEvent(e) {
    const rect = sw.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  }

  sw.addEventListener('mousedown', e => {
    if (!totalDur) return;
    dragging = true;
    sw.classList.add('dragging');
    seekTo(posFromEvent(e) * totalDur);
  });
  window.addEventListener('mousemove', e => {
    if (!dragging || !totalDur) return;
    seekTo(posFromEvent(e) * totalDur);
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    sw.classList.remove('dragging');
  });

  // touch
  sw.addEventListener('touchstart', e => {
    if (!totalDur) return;
    dragging = true;
    seekTo(posFromEvent(e.touches[0]) * totalDur);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!dragging || !totalDur) return;
    seekTo(posFromEvent(e.touches[0]) * totalDur);
  }, { passive: true });
  window.addEventListener('touchend', () => dragging = false);
})();

// ─────────────────────────────────────────────────────
//  MASTER VOLUME
// ─────────────────────────────────────────────────────
document.getElementById('masterVol').addEventListener('input', e => {
  masterVol = parseFloat(e.target.value);
  ALL_STEMS.forEach(stem => applyVolume(stem.id));
});

// ─────────────────────────────────────────────────────
//  PLAY BUTTON
// ─────────────────────────────────────────────────────
(function() {
  const btn = document.getElementById('playBtn');
  let lastTouch = 0;
  btn.addEventListener('touchend', e => {
    e.preventDefault();            // блокирует синтетический click после touch
    const now = Date.now();
    if (now - lastTouch < 300) return;  // защита от двойного тапа
    lastTouch = now;
    togglePlay();
  }, { passive: false });
  btn.addEventListener('click', e => {
    // на мобиле уже отработал touchend, пропускаем
    if (Date.now() - lastTouch < 300) return;
    togglePlay();
  });
})();

// ─────────────────────────────────────────────────────
//  KEYBOARD SHORTCUTS
// ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); if (!document.getElementById('playBtn').disabled) togglePlay(); }
  if (e.code === 'ArrowLeft')  seekTo(currentTime() - 5);
  if (e.code === 'ArrowRight') seekTo(currentTime() + 5);
  if (e.code === 'Home') seekTo(0);
});

// ─────────────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
